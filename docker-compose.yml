version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moncasin-db
    environment:
      POSTGRES_DB: moncasin
      POSTGRES_USER: casino_user
      POSTGRES_PASSWORD: casino_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino_user -d moncasin"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moncasin-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://casino_user:casino_password@postgres:5432/moncasin
      JWT_SECRET: moncasin-jwt-secret-ultra-securise-2024
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/src/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moncasin-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
